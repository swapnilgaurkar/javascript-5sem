<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Information</title>
</head>

<body style="margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#74ebd5,#9face6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;">

<!-- Watermark -->
<div style="
position:fixed;
top:20px;
right:20px;
background:rgba(255,255,255,0.8);
padding:8px 15px;
border-radius:10px;
font-size:15px;
font-weight:bold;
color:#0066cc;
border:2px solid #0066cc;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
z-index:9999;">
👨‍💻 Created By<br>
Swapnil Gaurkar<br>
PRN: 25070521504
</div>

<div style="
width:450px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.3);
position:relative;
z-index:1;">

<h2 style="text-align:center;color:#0066cc;">🎓 Student Information</h2>

<h4 style="text-align:center;color:#444;">
Symbiosis Institute of Technology (SIT), Nagpur
</h4>

<p style="
text-align:center;
font-size:14px;
font-weight:bold;
color:#555;
margin-top:-5px;
margin-bottom:15px;">
Created By: Swapnil Gaurkar
<br>
PRN: 25070521504
</p>

<hr>

<label><b>Name</b></label>
<input type="text" id="name" placeholder="Enter Name"
style="width:100%;padding:10px;margin:8px 0 15px;border-radius:5px;border:1px solid #ccc;">

<label><b>Age</b></label>
<input type="number" id="age" placeholder="Enter Age"
style="width:100%;padding:10px;margin:8px 0 15px;border-radius:5px;border:1px solid #ccc;">

<label><b>Gender</b></label>

<select id="gender"
style="width:100%;padding:10px;margin:8px 0 15px;border-radius:5px;border:1px solid #ccc;">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label><b>Branch</b></label>
<input type="text" id="branch" placeholder="Enter Branch"
style="width:100%;padding:10px;margin:8px 0 15px;border-radius:5px;border:1px solid #ccc;">

<label><b>PRN</b></label>
<input type="text" id="prn" placeholder="Enter PRN"
style="width:100%;padding:10px;margin:8px 0 20px;border-radius:5px;border:1px solid #ccc;">

<button onclick="showStudent()"
style="width:100%;
padding:12px;
background:#0066cc;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;">
Show Details
</button>

<div style="margin-top:20px;padding:15px;background:#f5f5f5;border-radius:10px;">

<h3 style="text-align:center;">Student Profile</h3>

<p><b>👤 Name :</b> <span id="sname">-</span></p>

<p><b>🎂 Age :</b> <span id="sage">-</span></p>

<p><b>🚹 Gender :</b> <span id="sgender">-</span></p>

<p><b>💻 Branch :</b> <span id="sbranch">-</span></p>

<p><b>🎓 PRN :</b> <span id="sprn">-</span></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
