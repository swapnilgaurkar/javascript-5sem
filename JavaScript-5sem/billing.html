<!DOCTYPE html>
<html>
<head>
<title>Billing Calculator</title>
<link rel="stylesheet" href="style2.css">
</head>

<body>

<div style="
position:fixed;
bottom:15px;
right:15px;
background:#0056b3;
color:white;
padding:10px 15px;
border-radius:10px;
font-size:14px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.3);
z-index:9999;">
Created By:<br>
Swapnil Gaurkar<br>
PRN: 25070521504
</div>

<div class="watermark">
Swapnil Gaurkar
<br>
PRN : 25070521504
</div>

<div class="container">

<h1>🧾 Billing Calculator</h1>

<input type="text" id="customer" placeholder="Customer Name">

<input type="text" id="item" placeholder="Item Name">

<input type="number" id="price" placeholder="Price">

<input type="number" id="qty" placeholder="Quantity">

<select id="discount">
<option value="0">Discount 0%</option>
<option value="5">Discount 5%</option>
<option value="10">Discount 10%</option>
<option value="15">Discount 15%</option>
<option value="20">Discount 20%</option>
</select>

<select id="gst">
<option value="0">GST 0%</option>
<option value="5">GST 5%</option>
<option value="12">GST 12%</option>
<option value="18">GST 18%</option>
<option value="28">GST 28%</option>
</select>

<button onclick="generateBill()">Generate Bill</button>

<div class="bill">

<h2>Bill Summary</h2>

<p><b>Customer :</b> <span id="cname">-</span></p>

<p><b>Item :</b> <span id="iname">-</span></p>

<p><b>Price :</b> ₹<span id="iprice">0</span></p>

<p><b>Quantity :</b> <span id="iqty">0</span></p>

<p><b>Subtotal :</b> ₹<span id="subtotal">0</span></p>

<p><b>Discount :</b> ₹<span id="discountAmount">0</span></p>

<p><b>GST :</b> ₹<span id="gstAmount">0</span></p>

<hr>

<h2>Total : ₹<span id="total">0</span></h2>

</div>

</div>

<script src="script3.js"></script>

</body>
</html>
